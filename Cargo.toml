[workspace]
resolver = "2"
members = ["crates/fuzzy", "crates/prism"]

[workspace.package]
version = "2.0.1"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/prism-analytics"

[workspace.dependencies]
# Converge platform contracts
converge-pack = "3.9.1"
converge-optimization = "3.9.1"
converge-kernel = "3.9.1"

# Internal: extracted fuzzy inference engine (no heavy ML deps).
converge-fuzzy-inference = { path = "crates/fuzzy", version = "2.0.1" }

# ML / data
polars = { version = "0.51.0", features = ["csv", "lazy", "log", "ndarray", "parquet", "rows"] }
burn = { version = "0.20.0", features = ["ndarray", "train"] }
ndarray = "0.17.2"
calamine = "0.34"

# Common
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
proptest = "1.5"
rand = "0.8"
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
tracing = "0.1"

# Dev
tempfile = "3"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"
# Style-only pedantic lints we accept across the workspace.
default_trait_access = "allow"
struct_field_names = "allow"
unreadable_literal = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"
ignore_without_reason = "allow"
# Reference checks compare exact f64 outputs from deterministic algorithms.
float_cmp = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
