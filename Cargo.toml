[workspace]
resolver = "2"
members = ["crates/fuzzy", "crates/prism"]

[workspace.package]
version = "2.0.3"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/prism-analytics"

[workspace.dependencies]
# Converge platform contracts
converge-pack = "3.9.3"
converge-optimization = "3.9.3"
converge-kernel = "3.9.3"

# Internal: extracted fuzzy inference engine (no heavy ML deps).
converge-fuzzy-inference = { path = "crates/fuzzy", version = "2.0.3" }

# ML / data
polars = { version = "0.51.0", features = ["csv", "lazy", "log", "ndarray", "parquet", "rows"] }
burn = { version = "0.21.0", default-features = false, features = ["ndarray"] }
ndarray = "0.17.2"
calamine = "0.35"

# Common
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
proptest = "1.5"
rand = "0.10"
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
tracing = "0.1"

# Dev
tempfile = "3"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"
# Style-only pedantic lints we accept across the workspace.
default_trait_access = "allow"
struct_field_names = "allow"
unreadable_literal = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"
ignore_without_reason = "allow"
# Reference checks compare exact f64 outputs from deterministic algorithms.
float_cmp = "allow"
# RP-HERMETIC-UNIT (Reflective QUALITY_BACKLOG.md → QF-2026-06-02-05):
# denies `reqwest::Client::new` / `reqwest::blocking::Client::new` /
# `::builder` so unit tests can't accidentally hit the network. The
# disallowed-methods list lives in `clippy.toml` at the workspace root.
# Production callsites either use a DI constructor (see Reflective KB
# standard `hermetic-unit-tests.md`) or annotate the construction with
# `#[allow(clippy::disallowed_methods)]` + a justification comment.
# Set to `deny` 2026-06-07 — prism-analytics had zero reqwest callsites
# in src at that time; this config keeps it clean going forward.
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
converge-pack         = { path = "../../bedrock-platform/converge/crates/pack" }
converge-kernel       = { path = "../../bedrock-platform/converge/crates/kernel" }
converge-core         = { path = "../../bedrock-platform/converge/crates/core" }
converge-model        = { path = "../../bedrock-platform/converge/crates/model" }
converge-optimization = { path = "../../bedrock-platform/converge/crates/optimization" }
converge-runtime      = { path = "../../bedrock-platform/converge/crates/runtime" }
converge-experience   = { path = "../../bedrock-platform/converge/crates/experience" }
converge-provider     = { path = "../../bedrock-platform/converge/crates/provider" }
organism-pack         = { path = "../../bedrock-platform/organism/crates/pack" }
organism-intent       = { path = "../../bedrock-platform/organism/crates/intent" }
organism-planning     = { path = "../../bedrock-platform/organism/crates/planning" }
organism-adversarial  = { path = "../../bedrock-platform/organism/crates/adversarial" }
organism-simulation   = { path = "../../bedrock-platform/organism/crates/simulation" }
organism-learning     = { path = "../../bedrock-platform/organism/crates/learning" }
organism-runtime      = { path = "../../bedrock-platform/organism/crates/runtime" }
organism-dynamics     = { path = "../../bedrock-platform/organism/crates/dynamics" }
