[workspace]
resolver = "2"
members = ["crates/prism"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/Reflective-Lab/prism"

[workspace.dependencies]
# Converge platform contracts
converge-pack = "3.7.6"
converge-domain = "3.7.6"
converge-optimization = "3.7.6"
converge-provider = "3.7.6"
converge-storage = { version = "3.7.6", default-features = false }
converge-kernel = "3.7.6"

# ML / data
polars = { version = "0.51.0", features = ["csv", "lazy", "log", "ndarray", "parquet", "rows"] }
burn = { version = "0.20.0", features = ["ndarray", "train"] }
ndarray = "0.17.2"
calamine = "0.34"

# Common
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
proptest = "1.5"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
bincode = "1.3"
tokio = { version = "1.48", features = ["full", "macros", "sync"] }
tracing = "0.1"

# Dev
tempfile = "3"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Track unreleased Converge platform head until each crate ships to crates.io.
[patch.crates-io]
converge-pack = { path = "../../work/converge/crates/pack" }
converge-domain = { path = "../../work/converge/crates/domain" }
converge-optimization = { path = "../../work/converge/crates/optimization" }
converge-provider = { path = "../../work/converge/crates/provider" }
converge-storage = { path = "../../work/converge/crates/storage" }
converge-kernel = { path = "../../work/converge/crates/kernel" }
