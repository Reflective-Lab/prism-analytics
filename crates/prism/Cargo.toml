[package]
name = "converge-prism-analytics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Closed-form analytics and inference for Converge agents: feature extraction, inference packs, and fuzzy inference. Training-pipeline concerns live in converge-crucible-models."

[lib]
name = "prism"
path = "src/lib.rs"

[dependencies]
polars.workspace = true
calamine = { workspace = true, optional = true }
burn.workspace = true
ndarray.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
tokio.workspace = true
tracing.workspace = true

# Converge contracts
converge-pack.workspace = true

# Converge platform dependencies
converge-optimization.workspace = true

[dev-dependencies]
converge-kernel.workspace = true
tempfile.workspace = true
trybuild.workspace = true
proptest.workspace = true

[features]
default = []
excel = ["dep:calamine"]

[lints]
workspace = true
